# PhotoShare — data-plane (public gallery) Apache2 vhost.
#
# Serves the static gallery frontend directly from disk and reverse-proxies
# /gallery/* to the data-plane proxy container (docker-compose service
# "data-proxy", published on host port 8100; Apache2 reaches it on
# 127.0.0.1). Putting the frontend and proxy behind the SAME origin/port
# means the frontend's common.js can use a relative PROXY_BASE_URL (already
# set to '' — see frontend/common.js) with no CORS configuration needed at all;
# GALLERY_PROXY_CORS_ORIGINS in the proxy's own .env can stay empty.
#
# Deploy: see CLOUD_DEPLOY.md step 5. In short, copy to
# /etc/apache2/sites-available/photoshare-gallery.conf, set ServerName,
# then:
#   sudo a2ensite photoshare-gallery
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo systemctl reload apache2
#
# TLS: this file only defines the plain-HTTP vhost. Either run
# `certbot --apache` against it (it will add its own :443 VirtualHost with
# the same ProxyPass directives, and usually a redirect here), or
# duplicate this block manually into a :443 VirtualHost with your own
# SSLCertificateFile/SSLCertificateKeyFile. Certbot's copy lives in
# photoshare-gallery-le-ssl.conf; later edits to this file must be made
# there too. Do not terminate TLS in the proxy container itself — both
# containers expect plain HTTP from Apache2.

<VirtualHost *:80>
    ServerName gallery.example.com

    # --- Static frontend -----------------------------------------------
    # Where the gallery's site files are copied to (see CLOUD_DEPLOY.md
    # step 5). If you change it, change the <Directory> path below too.
    DocumentRoot /var/www/photoshare-gallery

    <Directory /var/www/photoshare-gallery>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # --- Browser caching for the frontend's own files ---------------
        # Without these, Apache sends no Cache-Control and browsers guess
        # how long to reuse a file (often days), so after a deploy a
        # visitor can end up with new HTML and an old script, or the
        # reverse. Needs mod_headers (a2enmod headers).
        #
        # HTML: always check with the server before reusing. Unchanged
        # pages cost only a tiny 304 "not modified" reply (ETag /
        # Last-Modified), so this stays cheap.
        <FilesMatch "\.html?$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        # CSS/JS: frontend/stamp_assets.py tags each link in the deployed
        # HTML with a hash of the file (style.css?v=3f9a1c2b7d4e), so a
        # tagged URL's contents never change -- browsers may keep it for a
        # year without checking. Untagged requests (stamping skipped, or
        # files opened directly) fall back to always checking, like HTML.
        <FilesMatch "\.(css|js)$">
            <If "%{QUERY_STRING} =~ /(^|&)v=[0-9a-f]+(&|$)/">
                Header set Cache-Control "public, max-age=31536000, immutable"
            </If>
            <Else>
                Header set Cache-Control "no-cache"
            </Else>
        </FilesMatch>
        # The "check first" replies above are only cheap if Apache answers
        # 304. Ubuntu enables mod_deflate by default, which appends -gzip
        # to the ETag of compressed replies but then doesn't recognise that
        # ETag when the browser sends it back, so every check would resend
        # the whole file. Also offer the original ETag so the comparison
        # matches. (The ETag still changes whenever a file's size or
        # modification time does, including a rollback to older files.)
        RequestHeader edit "If-None-Match" '^"((.*)-gzip)"$' '"$1", "$2"'
    </Directory>

    # --- Reverse proxy to the data-plane proxy container ----------------
    # The proxy's own routes are already prefixed with /gallery/*
    # (see proxy/main.py), so this maps 1:1 with no path
    # rewriting needed. ProxyPreserveHost lets the proxy's CORS/host checks
    # see the real public hostname rather than 127.0.0.1.
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /gallery/ http://127.0.0.1:8100/gallery/
    ProxyPassReverse /gallery/ http://127.0.0.1:8100/gallery/

    # Forward the real client IP/proto to the proxy container, in case it
    # ever logs or rate-limits by address.
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    ErrorLog  ${APACHE_LOG_DIR}/photoshare-gallery-error.log
    CustomLog ${APACHE_LOG_DIR}/photoshare-gallery-access.log combined
</VirtualHost>
