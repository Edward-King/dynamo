# PhotoShare — data-plane (public gallery) Apache2 vhost.
#
# Serves the static gallery frontend directly from disk and reverse-proxies
# /gallery/* to the data-plane proxy container (docker-compose service
# "data-proxy", published on the host at 127.0.0.1:8100). Putting the
# frontend and proxy behind the SAME origin/port means the frontend's
# common.js can use a relative PROXY_BASE_URL (already set to '' — see
# deployment/frontend/common.js) with no CORS configuration needed at all;
# GALLERY_PROXY_CORS_ORIGINS in the proxy's own .env can stay empty.
#
# Deploy: copy to /etc/apache2/sites-available/photoshare-gallery.conf,
# adjust ServerName/DocumentRoot/paths for your host, then:
#   sudo a2ensite photoshare-gallery
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo systemctl reload apache2
#
# TLS: this file only defines the plain-HTTP vhost. Either run
# `certbot --apache` against it (it will add its own :443 VirtualHost with
# the same ProxyPass/Alias directives, and usually a redirect here), or
# duplicate this block manually into a :443 VirtualHost with your own
# SSLCertificateFile/SSLCertificateKeyFile. Do not terminate TLS in the
# proxy container itself — both containers expect plain HTTP from Apache2
# (see project wiki: "Neither container terminates TLS").

<VirtualHost *:80>
    ServerName gallery.example.com

    # --- Static frontend -----------------------------------------------
    # Update to the real deployed path of deployment/frontend/ on this host.
    DocumentRoot /var/www/photoshare-gallery

    <Directory /var/www/photoshare-gallery>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # --- Reverse proxy to the data-plane proxy container ----------------
    # The proxy's own routes are already prefixed with /gallery/*
    # (see deployment/proxy/main.py), so this maps 1:1 with no path
    # rewriting needed. ProxyPreserveHost lets the proxy's CORS/host checks
    # see the real public hostname rather than 127.0.0.1.
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /gallery/ http://127.0.0.1:8100/gallery/
    ProxyPassReverse /gallery/ http://127.0.0.1:8100/gallery/

    # Forward the real client IP/proto to the proxy container, in case it
    # ever logs or rate-limits by address.
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    ErrorLog  ${APACHE_LOG_DIR}/photoshare-gallery-error.log
    CustomLog ${APACHE_LOG_DIR}/photoshare-gallery-access.log combined
</VirtualHost>
