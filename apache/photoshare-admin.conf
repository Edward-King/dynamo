# PhotoShare — admin-plane Apache2 vhost.
#
# Serves the standalone admin frontend directly from disk and reverse-proxies
# /admin/* and /admin-proxy-health to the admin-plane proxy container
# (docker-compose service "admin-proxy", published on the host at
# 127.0.0.1:8200). Same same-origin reasoning as the data-plane vhost: the
# admin frontend's ADMIN_PROXY_BASE_URL defaults to '' (relative — see
# deployment/admin-frontend/admin.js), so no CORS configuration is needed
# when this vhost is used as-is.
#
# Deliberately a SEPARATE vhost/subdomain from photoshare-gallery.conf, on
# its own document root and its own upstream proxy container/port, per
# Edward's decision to split data-plane and admin-plane traffic end to end
# (frontend, proxy, and now Apache2 routing) while keeping both planes
# publicly reachable and key-protected rather than network-restricted (no
# VPN/IP-allowlist requirement — see project wiki's "Data plane / admin
# plane split" section).
#
# Deploy: copy to /etc/apache2/sites-available/photoshare-admin.conf,
# adjust ServerName/DocumentRoot/paths for your host, then:
#   sudo a2ensite photoshare-admin
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo systemctl reload apache2
#
# TLS: same approach as the data-plane vhost — either `certbot --apache`
# against this file, or duplicate the block into your own :443
# VirtualHost with SSLCertificateFile/SSLCertificateKeyFile. TLS still
# terminates at Apache2 only, never inside the admin-proxy container.
#
# Residual risk (documented in the project wiki, not fixed by this vhost):
# the backend does not yet scope API keys to admin vs. data routes, so this
# vhost's separation is enforced only at the network/routing layer, not by
# the backend itself. A leaked admin-proxy API key is scoped to whatever
# the backend allows it to do today, which is everything.

<VirtualHost *:80>
    ServerName admin.photoshare.example.com

    # --- Static admin frontend ------------------------------------------
    # Update to the real deployed path of deployment/admin-frontend/ on
    # this host. A distinct DocumentRoot from the gallery vhost, on
    # purpose -- the admin UI shares no static assets with the gallery.
    DocumentRoot /var/www/photoshare-admin

    <Directory /var/www/photoshare-admin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # --- Reverse proxy to the admin-plane proxy container ----------------
    # The admin proxy's own routes are prefixed with /admin/*, plus its own
    # unprefixed /admin-proxy-health check (see
    # deployment/admin-proxy/main.py) -- both are proxied here, 1:1, no path
    # rewriting needed.
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /admin/ http://127.0.0.1:8200/admin/
    ProxyPassReverse /admin/ http://127.0.0.1:8200/admin/

    ProxyPass        /admin-proxy-health http://127.0.0.1:8200/admin-proxy-health
    ProxyPassReverse /admin-proxy-health http://127.0.0.1:8200/admin-proxy-health

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    ErrorLog  ${APACHE_LOG_DIR}/photoshare-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/photoshare-admin-access.log combined
</VirtualHost>
