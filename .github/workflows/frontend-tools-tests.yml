# Runs the tests for the gallery frontend's deploy-time tooling
# (frontend/stamp_assets.py, which adds ?v= version tags to CSS/JS links).
# Standard library only, so the only thing to install is pytest.
name: Frontend tools tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tools-tests.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tools-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-tools-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest Python on the Ubuntu 22.04 server that runs the
        # script at deploy time; 3.12 is the project's target.
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v
