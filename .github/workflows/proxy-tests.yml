# Runs the gallery proxy's pytest suite (proxy/test_main.py) on GitHub.
# The suite is fully offline -- respx fakes PhotoShare and conftest.py
# writes a throwaway config.json -- so no secrets or services are needed.
name: Proxy tests

on:
  pull_request:
    paths:
      - "proxy/**"
      - ".github/workflows/proxy-tests.yml"
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - ".github/workflows/proxy-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the project's target; 3.14 catches upcoming breakage.
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            proxy/requirements.txt
            proxy/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
